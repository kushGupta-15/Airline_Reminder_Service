services:
  - type: web
    name: skyflow-reminder-service
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: MESSAGE_BROKER_URL
        sync: false
      - key: EMAIL_ID
        sync: false
      - key: EMAIL_PASS
        sync: false
